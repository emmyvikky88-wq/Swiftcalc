
<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => console.log(error));
  });
}
</script><body>

  <main class="calculator">

    <header class="top-bar">
      <div>
        <h1>SwiftCalc</h1>
        <p>Scientific Calculator</p>
      </div>
      <span class="mode">SCI</span>
    </header>

    <section class="display">
      <div id="history">Ready to calculate</div>
      <div id="result">0</div>
      <div id="expression"></div>
    </section>

    <section class="keypad">
<section class="keypad">

  <div class="scientific-keypad">
    <button class="function" data-value="sin(">sin</button>
    <button class="function" data-value="cos(">cos</button>
    <button class="function" data-value="tan(">tan</button>
    <button class="function" data-value="log(">log</button>
    <button class="function" data-value="ln(">ln</button>

    <button class="function" data-value="sqrt(">√</button>
    <button class="function" data-value="^">xʸ</button>
    <button class="function" data-value="(">(</button>
    <button class="function" data-value=")">)</button>
    <button class="function" data-value="pi">π</button>

    <button class="function" data-value="e">e</button>
    <button class="function" data-value="!">x!</button>
    <button class="function" data-value="ans">ANS</button>
    <button class="function" data-value="percent">%</button>
    <button class="function" data-value="abs(">abs</button>
  </div>

  <div class="main-keypad">
    <button class="action" data-action="clear">AC</button>
    <button class="action" data-action="delete">DEL</button>
    <button class="operator" data-value="÷">÷</button>
    <button class="operator" data-value="×">×</button>

    <button data-value="7">7</button>
    <button data-value="8">8</button>
    <button data-value="9">9</button>
    <button class="operator" data-value="−">−</button>

    <button data-value="4">4</button>
    <button data-value="5">5</button>
    <button data-value="6">6</button>
    <button class="operator" data-value="+">+</button>

    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>
    <button class="equals" data-action="calculate">=</button>

    <button class="zero" data-value="0">0</button>
    <button data-value="00">00</button>
    <button data-value=".">.</button>
  </div>

</section>
</section>

    <footer>
      <p>SwiftCalc • Advanced Mathematics</p>
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
